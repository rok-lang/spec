name: notify site

# The docs on docs.rok-lang.org are built from this spec. On every change
# to main, ask rok-lang.org to rebuild and redeploy. Needs a repo secret
# SITE_DISPATCH_TOKEN: a fine-grained PAT with Contents: write on
# rok-lang/rok-lang.org (enough to POST a repository_dispatch).
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild rok-lang.org docs
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api repos/rok-lang/rok-lang.org/dispatches -f event_type=docs-content
